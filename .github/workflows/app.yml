# Compile l'installeur Windows de l'application Jade (app/) à chaque changement,
# et publie une version quand on pousse une étiquette app-v*.
name: Application Windows
on:
  push:
    branches: ['claude/jade-react-rebuild-pv2pig']
    paths: ['app/**', 'site/**', '.github/workflows/app.yml']
    tags: ['app-v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: Jade-Setup, path: app/dist/*.exe, retention-days: 30 }
      - if: startsWith(github.ref, 'refs/tags/app-v')
        uses: softprops/action-gh-release@v2
        with: { files: app/dist/*.exe }
